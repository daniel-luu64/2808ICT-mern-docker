apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mern-ingress
  namespace: mern
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # strip the matched prefix so /api/foo -> /foo on the backend
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  tls:
  - hosts:
      - REPLACE_HOST
    secretName: mern-tls
  rules:
  - host: REPLACE_HOST
    http:
      paths:
      # Frontend: keep path as-is (no strip needed)
      - path: /()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: frontend-svc
            port:
              number: 80

      # Backend API: strip /api (rewrite-target /$2)
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: backend-svc
            port:
              number: 3000

      # Mongo Express (served under /mongo-express/)
      - path: /mongo-express(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: me-svc
            port:
              number: 8081
