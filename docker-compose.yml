version: '3.8'

services:
  # MongoDB Database  
  mongo:
    build:
      context: .
      dockerfile: ./database/Dockerfile
    container_name: mern_mongodb
    ports:
      - "27017:27017" # private MongoDB
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: employees
    volumes:
      - mongodb_data:/data/db
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - mern_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mern_backend
    ports:
      - "3000:3000" # private HTTP
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://admin:admin123@mongo:27017/employees?authSource=admin # private MongoDB
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - mern_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:3000 # private HTTP
    container_name: mern_frontend
    ports:
      - "3001:80" # public HTTP
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mern_network

  # Nginx Proxy
  nginx:
    image: nginx:1.27-alpine
    container_name: mern_nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"               # public HTTP
    networks: 
      - mern_network
    restart: unless-stopped

  # Mongo Express (Database Admin UI)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: mern_mongo_express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongo:27017/
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - mern_network

volumes:
  mongodb_data:

networks:
  mern_network:
    driver: bridge
    